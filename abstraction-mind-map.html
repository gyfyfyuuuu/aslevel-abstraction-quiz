<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Using Abstraction — Interactive Mind Map</title><style>
:root{color-scheme:dark;--bg:#20252b;--node:#414a53;--root:#505267;--detail:#30423e;--line:#a6b1ff;--text:#f4f6fb;--muted:#bac3ce}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 Inter,Segoe UI,Arial,sans-serif;color:var(--text);overflow:hidden}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #343a40;background:#22272d;position:relative;z-index:2}h1{font-size:17px;margin:0;font-weight:650}header p{font-size:12px;color:var(--muted);margin:3px 0 0}.controls{display:flex;gap:8px}button{font:inherit;color:var(--text);border:1px solid #505963;background:#30363d;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{background:#414953}.canvas{height:calc(100vh - 70px);overflow:hidden;position:relative;touch-action:none;cursor:grab}.canvas.dragging{cursor:grabbing}.map{width:max-content;min-width:100%;min-height:100%;height:max-content;position:absolute;left:0;top:0;display:flex;align-items:center;padding:30px 70px;transform-origin:0 0;will-change:transform}.tree{position:relative;display:flex;align-items:center;gap:28px}.children{display:flex;flex-direction:column;gap:16px;position:relative}.branch{display:flex;align-items:center;gap:16px;position:relative}.node{position:relative;border:0;border-radius:9px;padding:13px 17px;white-space:normal;text-align:left;box-shadow:0 3px 12px #1113;max-width:320px;min-width:210px;transition:transform .2s,filter .2s,opacity .25s;animation:arrive .42s both}.node:hover{filter:brightness(1.12);transform:translateY(-1px)}.root{background:var(--root);min-width:360px;max-width:360px;font-size:18px}.topic{background:var(--node);font-size:16px;min-width:250px;max-width:250px}.detail{background:var(--detail);font-size:14px;min-width:340px;max-width:480px}.detail strong{color:#dce2ff}.toggle{width:25px;height:25px;min-width:25px;border-radius:50%;padding:0;display:grid;place-items:center;font-weight:700;background:#414b55;border:0}.toggle:hover{background:#5c6671}.hidden{display:none!important}.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.lines path{fill:none;stroke:var(--line);stroke-width:1.7;opacity:.82;stroke-linecap:round}.hint{position:fixed;bottom:12px;right:18px;color:#87919c;font-size:11px;z-index:2}.pill{border:1px solid #48515b;border-radius:20px;padding:5px 10px;color:#c0c9d2;font-size:11px}@keyframes arrive{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}@media(max-width:700px){header{height:auto;min-height:70px;padding:12px;align-items:flex-start;gap:10px}.controls{flex-wrap:wrap;justify-content:flex-end}.map{padding:28px 20px;min-height:650px}.root{min-width:280px;max-width:280px}.topic{min-width:220px;max-width:220px}}
</style></head><body><header><div><h1>9.1.1 · Using Abstraction</h1><p>Computational thinking · Interactive mind map</p></div><div class="controls"><span class="pill">Click a node to expand or collapse</span><button id="zoomOut" title="Zoom out">−</button><span class="pill" id="zoomLabel">100%</span><button id="zoomIn" title="Zoom in">+</button><button id="fit">Fit map</button><button id="expand">Expand all</button><button id="collapse">Collapse all</button></div></header><main class="canvas" id="viewport"><div class="map" id="map"><svg class="lines" id="lines" aria-hidden="true"></svg><div class="tree" id="tree"></div></div></main><div class="hint">Wheel / trackpad to zoom · Drag background to move · Fit map returns to overview</div>
<script>
const data={title:'Using Abstraction in Computational Thinking',children:[{title:'Definition and Core Concepts',children:[{title:'Core principle',text:'Extract information that is essential and ignore irrelevant details.'},{title:'Purpose',text:'Build clear, simplified models suited to a specific problem.'},{title:'Everyday examples',text:'Maps, calendars and timetables use abstraction.'},{title:'Computational thinking',text:'Abstraction helps computer scientists model complex problems clearly.'}]},{title:'Benefits of Abstraction',children:[{title:'Faster development',text:'Less time is needed to develop the program, so it can reach the customer sooner.'},{title:'Smaller programs',text:'Programs use less memory and take less time to download.'},{title:'Greater satisfaction',text:'The solution meets customer requirements without unnecessary features.'}]},{title:'Stages of Abstraction',children:[{title:'1 · Identify the purpose',text:'Decide what the model is for. The situation may be real, imaginary or a future event.'},{title:'2 · Find information sources',text:'Gather observations, views from potential users and evidence from existing models.'},{title:'3 · Select relevant details',text:'Choose what to include and how to present it; remove details that are extraneous.'}]},{title:'Practical Modeling Examples',children:[{title:'Road map',text:'For journey planning, show roads, road numbers and towns. Leave out terrain detail that does not help the driver. Roads are scaled down to make the route easy to visualise.'},{title:'Satellite view',text:'Shows much more terrain information. That detail can be unnecessary when the goal is simply to plan a drive.'},{title:'Rail map',text:'Show rail lines and stations, and possibly wheelchair accessibility. Simplify the lines for clarity because passengers do not need to visualise the route.'},{title:'One situation, different models',text:'A model changes with its purpose: a road map supports route planning, while a rail map helps passengers navigate stations and services.'}]}]};let serial=0;
function makeNode(item,level){level=level||0;let id='n'+serial++,wrap=document.createElement('div');wrap.className='branch';let box=document.createElement('div');box.className='node '+(level===0?'root':level===1?'topic':'detail');if(level===2)box.innerHTML='<strong>'+item.title+': </strong>'+item.text;else box.textContent=item.title;wrap.append(box);if(item.children&&item.children.length){let btn=document.createElement('button');btn.className='toggle';btn.textContent='›';btn.setAttribute('aria-expanded','false');wrap.append(btn);let group=document.createElement('div');group.className='children hidden';item.children.forEach(c=>group.append(makeNode(c,level+1)));wrap.append(group);function toggle(){let open=group.classList.contains('hidden');group.classList.toggle('hidden',!open);btn.textContent=open?'‹':'›';btn.setAttribute('aria-expanded',String(open));requestAnimationFrame(draw)}btn.onclick=toggle;box.style.cursor='pointer';box.onclick=toggle}return wrap}
function draw(){let svg=document.getElementById('lines'),map=document.getElementById('map'),r=map.getBoundingClientRect();svg.setAttribute('viewBox','0 0 '+map.clientWidth+' '+map.clientHeight);svg.innerHTML='';document.querySelectorAll('.branch').forEach(parent=>{let group=parent.querySelector(':scope > .children');if(!group||group.classList.contains('hidden'))return;let a=parent.querySelector(':scope > .node').getBoundingClientRect();group.querySelectorAll(':scope > .branch').forEach(child=>{let b=child.querySelector(':scope > .node').getBoundingClientRect(),x1=(a.right-r.left)/zoom,y1=(a.top+a.height/2-r.top)/zoom,x2=(b.left-r.left)/zoom,y2=(b.top+b.height/2-r.top)/zoom,mid=(x1+x2)/2,p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M '+x1+' '+y1+' C '+mid+' '+y1+', '+mid+' '+y2+', '+x2+' '+y2);svg.append(p)})})}
document.getElementById('tree').append(makeNode(data));let zoom=1,panX=30,panY=24,canvas=document.getElementById('viewport'),mapEl=document.getElementById('map');function applyView(){mapEl.style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+zoom+')';document.getElementById('zoomLabel').textContent=Math.round(zoom*100)+'%'}function zoomAt(next,cx,cy){next=Math.max(.3,Math.min(2.5,next));let r=canvas.getBoundingClientRect(),x=cx-r.left,y=cy-r.top,k=next/zoom;panX=x-(x-panX)*k;panY=y-(y-panY)*k;zoom=next;applyView()}canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(zoom*Math.exp(-e.deltaY*.004),e.clientX,e.clientY)},{passive:false});document.getElementById('zoomIn').onclick=()=>{let r=canvas.getBoundingClientRect();zoomAt(zoom*1.25,r.left+r.width/2,r.top+r.height/2)};document.getElementById('zoomOut').onclick=()=>{let r=canvas.getBoundingClientRect();zoomAt(zoom/1.25,r.left+r.width/2,r.top+r.height/2)};document.getElementById('fit').onclick=()=>{let c=canvas.getBoundingClientRect(),t=document.getElementById('tree').getBoundingClientRect(),base=zoom||1,w=t.width/base,h=t.height/base;zoom=Math.min(1.35,(c.width-56)/w,(c.height-56)/h);panX=(c.width-w*zoom)/2;panY=(c.height-h*zoom)/2;applyView()};let drag=null;canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.node,button'))return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY};canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;applyView()});function endDrag(){drag=null;canvas.classList.remove('dragging')}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);document.getElementById('expand').onclick=()=>{document.querySelectorAll('.branch > .children').forEach(g=>{g.classList.remove('hidden');let b=g.parentElement.querySelector(':scope > .toggle');b.textContent='‹';b.setAttribute('aria-expanded','true')});requestAnimationFrame(draw)};document.getElementById('collapse').onclick=()=>{document.querySelectorAll('.branch > .children').forEach(g=>{g.classList.add('hidden');let b=g.parentElement.querySelector(':scope > .toggle');b.textContent='›';b.setAttribute('aria-expanded','false')});requestAnimationFrame(draw)};window.addEventListener('resize',()=>{document.getElementById('fit').click();draw()});requestAnimationFrame(()=>{applyView();document.getElementById('fit').click()});
</script></body></html>
